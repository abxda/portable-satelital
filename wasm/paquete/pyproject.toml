[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shepherd-pure"
version = "1.1.0"
description = "Segmentacion Shepherd (Remote Sensing 2019) en NumPy/SciPy puro, lista para Pyodide/WASM"
requires-python = ">=3.9"
# sin dependencias declaradas A PROPOSITO: en Pyodide numpy/scipy/sklearn se
# precargan desde el bundle; declararlas haria que piplite intente resolverlas
# y complicaria el modo offline.
dependencies = []

[tool.setuptools]
py-modules = ["shepherd_pure"]
