<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="Segoe UI,system-ui,sans-serif">
<rect width="760" height="190" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">El taller es tuyo: TUS datos, el mismo pipeline</text>
<g transform="translate(50,56)"><rect width="120" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/><text x="60" y="22" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4338ca">TU imagen .tif</text><rect y="44" width="120" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-dasharray="5 4"/><text x="60" y="66" text-anchor="middle" font-size="10.5" fill="#9a3412">tus etiquetas (opcional)</text></g><path d="M190,95 h36" stroke="#0ea5e9" stroke-width="4"/><path d="M226,95 l-9,-6 v12 Z" fill="#0ea5e9"/><g transform="translate(250,52)"><rect width="240" height="86" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/><text x="120" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">el MISMO pipeline del taller</text><text x="120" y="46" text-anchor="middle" font-size="10" fill="#475569">segmentar → tabla → (entrenar)</text><text x="120" y="72" text-anchor="middle" font-size="17">⚙️<animateTransform attributeName="transform" type="rotate" values="0 120 66;360 120 66" dur="4s" repeatCount="indefinite"/></text></g><path d="M510,95 h36" stroke="#0ea5e9" stroke-width="4"/><path d="M546,95 l-9,-6 v12 Z" fill="#0ea5e9"/><g transform="translate(570,56)"><rect width="150" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a"/><text x="75" y="22" text-anchor="middle" font-size="10.5" fill="#15803d" font-weight="700">TUS objetos + tabla</text><rect y="44" width="150" height="34" rx="6" fill="#fef2f2" stroke="#d62728"/><text x="75" y="66" text-anchor="middle" font-size="10.5" fill="#991b1b" font-weight="700">TU mapa clasificado</text></g>
<text x="20" y="178" font-size="12.5" fill="#475569">Escribe el nombre de tu GeoTIFF (y tus etiquetas si tienes) — la celda repite todo el flujo con TUS datos.</text>
