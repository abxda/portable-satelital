<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" font-family="Segoe UI,system-ui,sans-serif">
<rect width="760" height="190" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#0f172a">¿Dónde está corriendo este Python?</text>

<g transform="translate(120,52)">
  <rect width="270" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect width="270" height="22" rx="8" fill="#e2e8f0"/>
  <circle cx="14" cy="11" r="4" fill="#f87171"/><circle cx="28" cy="11" r="4" fill="#fbbf24"/><circle cx="42" cy="11" r="4" fill="#4ade80"/>
  <text x="135" y="16" text-anchor="middle" font-size="10" fill="#64748b">tu navegador</text>
  <rect x="85" y="42" width="100" height="40" rx="6" fill="#0ea5e9" opacity=".15" stroke="#0284c7"/>
  <text x="135" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1" font-family="Consolas,monospace">wasm32
    <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></text>
  <text x="135" y="96" text-anchor="middle" font-size="10.5" fill="#475569">Python completo, aquí adentro</text>
</g>
<g transform="translate(540,60)">
  <rect width="120" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="32" text-anchor="middle" font-size="11" fill="#94a3b8">servidor / nube</text>
  <line x1="18" y1="48" x2="102" y2="64" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
  <line x1="102" y1="48" x2="18" y2="64" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>
  <text x="60" y="100" text-anchor="middle" font-size="10.5" fill="#e11d48" font-weight="700">no se usa</text>
</g>
<g font-size="20">
  <text x="430" y="105">❓<animateTransform attributeName="transform" type="translate" values="0,0;60,-6;0,0" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></text>
</g>
<text x="20" y="178" font-size="12.5" fill="#475569">La celda le pregunta a Python dónde vive. Respuesta esperada: 'wasm32' — dentro de TU navegador, sin servidor.</text>
</svg>
