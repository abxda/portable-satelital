<g transform="translate(70,50)"><rect width="200" height="84" rx="8" fill="#f8fafc" stroke="#94a3b8"/><rect width="200" height="20" rx="8" fill="#e2e8f0"/><circle cx="13" cy="10" r="3.5" fill="#f87171"/><circle cx="25" cy="10" r="3.5" fill="#fbbf24"/><circle cx="37" cy="10" r="3.5" fill="#4ade80"/><text x="100" y="56" text-anchor="middle" font-size="11" fill="#475569">el taller, en tu navegador</text></g><rect x="280" y="72" width="46" height="14" rx="3" fill="#0ea5e9" opacity=".85"><animateTransform attributeName="transform" type="translate" values="0,0;210,10;210,10" keyTimes="0;.6;1" dur="2.8s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;.85;0" keyTimes="0;.8;1" dur="2.8s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="280" y="80" width="46" height="14" rx="3" fill="#0ea5e9" opacity=".85"><animateTransform attributeName="transform" type="translate" values="0,0;210,2;210,2" keyTimes="0;.6;1" dur="2.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;.85;0" keyTimes="0;.8;1" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></rect><rect x="280" y="88" width="46" height="14" rx="3" fill="#0ea5e9" opacity=".85"><animateTransform attributeName="transform" type="translate" values="0,0;210,-6;210,-6" keyTimes="0;.6;1" dur="2.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".85;.85;0" keyTimes="0;.8;1" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></rect><g transform="translate(530,50)"><path d="M0,8 h36 l10,10 h84 a8,8 0 0 1 8,8 v52 a8,8 0 0 1 -8,8 h-122 a8,8 0 0 1 -8,-8 v-62 a8,8 0 0 1 8,-8 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="65" y="48" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">mis_datos\salidas</text><text x="65" y="66" text-anchor="middle" font-size="10" fill="#92400e">TU disco, TU carpeta</text></g><text x="380" y="166" text-anchor="middle" font-size="11.5" fill="#475569">en el kit offline