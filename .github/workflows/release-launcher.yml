# Compila SatLab.exe en infraestructura de GitHub y publica el release con
# artifact attestation (procedencia SLSA verificable con `gh attestation verify`).
# Disparo: push de un tag vX.Y.Z.
#
# Esto es la pieza central del LINAJE: el exe que bajan las secretarías se
# construye aquí (público, auditable), no en una máquina personal.
name: release-launcher

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # crear el release
  id-token: write      # attestation
  attestations: write  # attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build SatLab.exe
        working-directory: satlab-launcher
        run: wails build -platform windows/amd64

      - name: Hashes
        shell: pwsh
        run: |
          $sha = (Get-FileHash satlab-launcher/build/bin/SatLab.exe -Algorithm SHA256).Hash.ToLower()
          "$sha  SatLab.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: satlab-launcher/build/bin/SatLab.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            satlab-launcher/build/bin/SatLab.exe `
            SHA256SUMS.txt `
            --title "SatLab $env:GITHUB_REF_NAME" `
            --notes "Launcher visual del Laboratorio Satelital Portable. Verificacion: VERIFICACION.md (attestation: ``gh attestation verify SatLab.exe --repo abxda/portable-satelital``)."
