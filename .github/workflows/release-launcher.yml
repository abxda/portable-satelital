# Compila SatLab.exe en infraestructura de GitHub y publica el release con
# artifact attestation (procedencia SLSA verificable con `gh attestation verify`).
# Disparo: push de un tag vX.Y.Z.
#
# Esto es la pieza central del LINAJE: el exe que bajan las secretarías se
# construye aquí (público, auditable), no en una máquina personal.
name: release-launcher

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # crear el release
  id-token: write      # attestation
  attestations: write  # attestation

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Guard - la UI embebida DEBE estar en el repo
        shell: pwsh
        run: |
          if (-not (Test-Path satlab-launcher/frontend/dist/index.html)) {
            Write-Error "FALTA satlab-launcher/frontend/dist/index.html: el exe saldria SIN ventana (bug v0.1.0). Revisa .gitignore."
            exit 1
          }

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build SatLab.exe
        working-directory: satlab-launcher
        run: wails build -platform windows/amd64

      - name: Build TallerServidor (3 OS, Go puro, reproducible)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          Set-Location taller-servidor
          go build -trimpath -ldflags "-s -w" -o ../TallerServidor.exe .
          $env:GOOS = "linux";  go build -trimpath -ldflags "-s -w" -o ../taller-servidor-linux-amd64 .
          $env:GOOS = "darwin"; $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w" -o ../taller-servidor-macos-arm64 .

      - name: Hashes
        shell: pwsh
        run: |
          $lineas = @()
          foreach ($f in @("satlab-launcher/build/bin/SatLab.exe", "TallerServidor.exe",
                           "taller-servidor-linux-amd64", "taller-servidor-macos-arm64")) {
            $sha = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lineas += "$sha  $(Split-Path $f -Leaf)"
          }
          $lineas | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attest TallerServidor (3 OS)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            TallerServidor.exe
            taller-servidor-linux-amd64
            taller-servidor-macos-arm64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: satlab-launcher/build/bin/SatLab.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            satlab-launcher/build/bin/SatLab.exe `
            TallerServidor.exe `
            taller-servidor-linux-amd64 `
            taller-servidor-macos-arm64 `
            SHA256SUMS.txt `
            --title "SatLab $env:GITHUB_REF_NAME" `
            --notes "Launcher visual del Laboratorio Satelital Portable. Verificacion: VERIFICACION.md (attestation: ``gh attestation verify SatLab.exe --repo abxda/portable-satelital``)."

  # SatLab para Linux, con la MISMA procedencia que el de Windows: compilado en
  # GitHub Actions + attestation. (Requiere webkit2gtk-4.1: Ubuntu >= 24.04 en
  # la maquina del alumno.)
  build-linux:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: System deps (GTK + WebKitGTK 4.1)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build SatLab (linux/amd64)
        working-directory: satlab-launcher
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Hashes
        run: |
          mv satlab-launcher/build/bin/SatLab SatLab-linux-amd64
          sha256sum SatLab-linux-amd64 > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: SatLab-linux-amd64

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" SatLab-linux-amd64 SHA256SUMS-linux.txt
